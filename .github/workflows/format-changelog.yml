name: Format Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/web/CHANGELOG.md'

permissions:
  contents: write

jobs:
  format-changelog:
    if: ${{ startsWith(github.head_ref, 'release-please--') && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format changelog
        run: npx prettier apps/web/CHANGELOG.md --write

      - name: Commit formatted changelog
        run: |
          if git diff --quiet -- apps/web/CHANGELOG.md; then
            echo "No changelog formatting updates needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/CHANGELOG.md
          git commit -m "chore(release): format changelog"
          git push
